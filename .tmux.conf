# Ensure colors are correct for Kitty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g default-command "${SHELL}"

# default config
# set -ag terminal-overrides ",xterm-256color:RGB"

# Tell tmux that terminals identifying as 'xterm-kitty' or 'wezterm' (requires for correctly rendering images with imagamagick for nvim snacks picker
# support RGB color and the Kitty graphics protocol.
set-option -g terminal-overrides ",xterm-kitty:RGB:kitty,wezterm:RGB:kitty"

# Increase scrollback buffer size
set -g history-limit 30000

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi
# Added for tools like tmux-snacks that need to send special key sequences
set-window-option -g allow-passthrough on





# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10
set-option -g focus-events on

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
# set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-yank' # allow to yank copied text to clipboard

set -g @resurrect-dir '~/.tmux/resurrect' # make sure this directory exist
set -g @resurrect-capture-pane-contents 'on' # restore also the contents of the windows
# for vim
# set -g @resurrect-strategy-vim 'session'
# for neovim (https://git.zib.de/salzmann-jaeckel/tmux-resurrect/-/tree/4f685d5c3df2547a4b1e4b2f633a562e8ae258b8#restoring-vim-and-neovim-sessions )
set -g @resurrect-strategy-nvim 'session'
# set -g @resurrect-save 'S'
# set -g @resurrect-restore 'R'
set -g @continuum-restore 'on' #restore the last saved session automatically after restart
set -g @continuum-save-interval '5' # save session very 5 minutes


# set -g @resurrect-save-file-pattern 'tmux_resurrect_%Y%m%dT%H%M%S_#{session_name}.txt'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Nach TPM, damit tmux-yank nicht überschreibt
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"

bind-key -T copy-mode-vi Escape send -X cancel
# bind-key -T copy-mode-vi 'y' send -X copy-selection-no-clear \; display "Copied to clipboard"
bind-key -T copy-mode-vi 'y' send -X copy-selection \; display "Copied to clipboard (no clear)"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# https://unix.stackexchange.com/questions/318281/how-to-copy-and-paste-with-a-mouse-with-tmux
